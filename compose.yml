# ─────────────────────────────────────────────────────────────────────────────
#  Shared environment.
#  DATABASE_URL (Neon) drives all PostgreSQL connections.
#  Local postgres container is removed — Neon is used instead.
# ─────────────────────────────────────────────────────────────────────────────
x-common-env: &common-env
  ENABLE_MOCK: ${ENABLE_MOCK:-true}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-groq}
  LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}

  # ── Neon PostgreSQL ──────────────────────────────────────────────────────
  # Set DATABASE_URL to your Neon connection string (pooled recommended).
  # Example: postgresql://user:pass@ep-xxx.us-east-2.aws.neon.tech/governance_db?sslmode=require
  DATABASE_URL: ${DATABASE_URL:-}
  POSTGRES_SSLMODE: require

  # ── Redis ─────────────────────────────────────────────────────────────────
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_ENABLED: "true"

  SQLITE_PATH: /app/data/memory.db
  LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
  LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
  LANGCHAIN_PROJECT: data-governance-copilot

  VECTOR_COLLECTION: governance_docs
  INGESTION_EMBEDDING_MODEL: text-embedding-3-small

services:
  # ── Redis (still local — fast cache) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Streamlit UI ──────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      <<: *common-env
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    ports:
      - "8501:8501"
    depends_on:
      redis:
        condition: service_healthy

  # ── FastAPI REST / SSE ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    environment:
      <<: *common-env
    volumes:
      - ./data:/app/data
      - ./docs:/app/docs
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  # ── MCP Server (SSE transport) ────────────────────────────────────────────
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: python -m src.mcp_server.server
    environment:
      <<: *common-env
      TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8002
    volumes:
      - ./data:/app/data
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy

  # ── Airflow services (use Neon for metadata DB too) ───────────────────────
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_URL:-${DATABASE_URL:-}}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-changeme}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    command: >
      bash -c "/opt/airflow/venv/bin/airflow db migrate &&
               /opt/airflow/venv/bin/airflow users create --username $$AIRFLOW_ADMIN_USER
               --password $$AIRFLOW_ADMIN_PASSWORD --firstname Admin
               --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_URL:-${DATABASE_URL:-}}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-changeme}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_DOCS_PATH: /opt/airflow/docs
    command: /opt/airflow/venv/bin/airflow webserver
    volumes:
      - ./dags:/opt/airflow/dags
      - ./docs:/opt/airflow/docs
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      <<: *common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_URL:-${DATABASE_URL:-}}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_DOCS_PATH: /opt/airflow/docs
    command: /opt/airflow/venv/bin/airflow scheduler
    volumes:
      - ./dags:/opt/airflow/dags
      - ./docs:/opt/airflow/docs
      - airflow_logs:/opt/airflow/logs
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  redis_data:
  airflow_logs:
