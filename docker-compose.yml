version: "3.9"

services:
  # ── FastAPI REST API ───────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python ui/api.py
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - copilot-net

  # ── Streamlit Web UI ───────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - copilot-net

  # ── ChromaDB Vector Store (optional) ──────────────────────
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8002:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped
    networks:
      - copilot-net

networks:
  copilot-net:
    driver: bridge

volumes:
  chroma-data:
