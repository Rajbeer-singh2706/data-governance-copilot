[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-governance-copilot"
version = "1.0.0"
description = "Agentic AI Data Governance & Analytics Assistant"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.28.0",
    "apache-airflow>=2.10.0",
    "docx2txt>=0.8",
    "fastapi>=0.111.0",
    "groq>=0.9.0",
    "httpx>=0.27.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-postgres>=0.0.9",
    "langchain-text-splitters>=0.2.0",
    "langgraph>=0.1.0",
    "langsmith>=0.1.0",
    "litellm>=1.40.0",
    "mcp>=1.0.0",
    "openai>=1.30.0",
    "openpyxl>=3.1.0",
    "pgvector>=0.2.5",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pypdf>=4.0.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "python-pptx>=0.6.23",
    "redis>=5.0.0",
    "ruff>=0.4.0",
    "slowapi>=0.1.9",
    "sse-starlette>=2.1.0",
    "starlette>=0.37.0",
    "streamlit>=1.35.0",
    "structlog>=24.1.0",
    "unstructured>=0.14.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m not integration')",
    "smoke: marks tests as smoke tests",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["E501", "E402", "F401"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/ui/*",
    "src/teams/*",
    "*/test_*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
