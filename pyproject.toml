# ═══════════════════════════════════════════════════════════════════════════
# Data Governance Copilot — pyproject.toml
#
# Python: 3.12  (3.13 skipped — C-ext friction with hiredis / psycopg2)
#
# IMPORTANT — LangChain version matrix:
#   All langchain-* packages must stay on the SAME major line.
#   This project uses the 0.3.x line (langchain-core 0.3.76).
#   langchain-groq 1.x / langchain-litellm 0.6+ require langchain-core 1.x
#   which is a fully different series — do NOT mix them.
#
#   Compatible provider versions for langchain-core 0.3.x:
#     langchain-groq    == 0.3.8   (latest in 0.x series)
#     langchain-litellm >= 0.3.0, < 0.7.0
# ═══════════════════════════════════════════════════════════════════════════

[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name            = "data-governance-copilot"
version         = "0.1.0"
description     = "Agentic AI Data Governance & Analytics Assistant"
requires-python = ">=3.12,<3.13"

dependencies = [
    # ── Core utilities ────────────────────────────────────────────────
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0,<3.0.0",

    # ── LangChain 0.3.x (all pinned to the same line) ─────────────────
    "langchain==0.3.27",
    "langchain-core==0.3.76",
    "langchain-community==0.3.29",
    "langchain-openai==0.3.33",
    "langsmith>=0.2.0",

    # ── LangGraph + memory ────────────────────────────────────────────
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",

    # ── LLM providers (0.3.x-compatible versions) ─────────────────────
    "langchain-groq==0.3.8",
    "langchain-litellm>=0.3.0,<0.7.0",

    # ── Caching ───────────────────────────────────────────────────────
    "redis>=5.0.0",
    "hiredis>=2.3.0",

    # ── UI ────────────────────────────────────────────────────────────
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

# Day 16+: install with  uv sync --extra api
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "slowapi>=0.1.9",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
]

# Day 18+: install with  uv sync --extra pgvector
pgvector = [
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",
    "langchain-postgres>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]

[tool.uv]
compile-bytecode = true