[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name            = "data-governance-copilot"
version         = "0.1.0"
requires-python = ">=3.11"
dependencies    = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "streamlit>=1.35.0",
]   

[tool.setuptools.packages.find]
where = ["src"]               # all source code lives in src/

[tool.pytest.ini_options]
pythonpath = ["src"]          # pytest can find src/ packages
testpaths  = ["tests"]        # pytest only looks in tests/
