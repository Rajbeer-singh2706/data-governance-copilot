[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name            = "data-governance-copilot"
version         = "0.1.0"
requires-python = ">=3.11"
dependencies    = [
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pytest>=8.0.0",
    "streamlit>=1.35.0",
    "langgraph[sqlite]>=1.2.0",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.1",
    "langchain-community>=0.4.1",
    "openai>=2.37.0",
    "langsmith>=0.8.5",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.13.4",
    "redis>=5.0.0",
    "hiredis>=2.3.0",
]   

[tool.setuptools.packages.find]
where = ["src"]               # all source code lives in src/

[tool.pytest.ini_options]
pythonpath = ["src"]          # pytest can find src/ packages
testpaths  = ["tests"]        # pytest only looks in tests/
