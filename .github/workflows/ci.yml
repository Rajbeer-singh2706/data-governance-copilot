name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  ENABLE_MOCK: "true"
  ENVIRONMENT: "development"
  REDIS_ENABLED: "false"
  LOG_LEVEL: "WARNING"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install uv && uv pip install --system ruff
      - run: ruff check src/ tests/ --ignore E501,E402,F401

  test:
    name: Test (coverage ≥ 80%)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install uv && uv pip install --system -r requirements.txt
      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/ -v -m "not integration" \
            --cov=src --cov-report=term-missing \
            --cov-report=xml --cov-fail-under=80 \
            --tb=short -q
        env:
          ENABLE_MOCK: "true"
          ENVIRONMENT: "development"
          REDIS_ENABLED: "false"
          SQLITE_PATH: ":memory:"
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          target: runtime
          push: false
          tags: data-governance-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build Airflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile.airflow
          push: false
          tags: data-governance-copilot-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
