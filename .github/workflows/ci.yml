name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  ENABLE_MOCK: "true"
  ENVIRONMENT: "development"
  REDIS_ENABLED: "false"
  LOG_LEVEL: "WARNING"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install lint tools
        run: uv pip install --system ruff

      - name: Run ruff
        run: ruff check src/ tests/ dags/ --ignore E501,E402

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Run unit tests (no integration)
        run: uv run pytest tests/ -v -m "not integration" --tb=short
        env:
          ENABLE_MOCK: "true"
          ENVIRONMENT: "development"
          REDIS_ENABLED: "false"
          SQLITE_PATH: ":memory:"

      - name: Upload coverage
        if: always()
        run: |
          uv run pytest tests/ -m "not integration" \
            --cov=src --cov-report=xml --cov-report=term-missing \
            -q 2>/dev/null || true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          target: runtime
          push: false
          tags: data-governance-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Airflow image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile.airflow
          push: false
          tags: data-governance-copilot-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max